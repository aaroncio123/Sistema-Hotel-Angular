<button
  (click)="toggleChat()"
  class="fixed bottom-6 right-6 bg-[#fbbb34] text-black px-5 py-4 rounded-full shadow-lg z-50"
>
  ChateaQui
</button>

<div
  *ngIf="chatAbierto"
  class="fixed bottom-24 right-6 bg-[#000000] text-white p-8 rounded-xl w-full max-w-md shadow-xl z-50"
>
  <button
    (click)="cerrarChat()"
    class="absolute top-3 right-4 text-white"
  >
    X
  </button>

  <h2 class="text-xl font-bold mb-4">Asistente HotelesUPN</h2>

  <div class="bg-[#FFFFFF] text-black p-4 rounded mb-4 min-h-[200px]">
    <div *ngFor="let mensaje of mensajes" class="mb-2">
      <strong>{{ mensaje.remitente }}:</strong>
      {{ mensaje.texto }}
    </div>
  </div>

  <input
    [(ngModel)]="mensajeUsuario"
    type="text"
    placeholder="Escribe tu pregunta..."
    class="w-full p-3 rounded mb-3 bg-[#FFFFFF] text-black"
  />

  <button
    (click)="enviarPregunta()"
    class="bg-[#fbbb34] hover:bg-[#fbbb36] text-black px-4 py-2 rounded w-full"
  >
    Enviar
  </button>
</div>
