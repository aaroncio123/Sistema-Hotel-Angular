<div class="login-container w-full h-[100vh] p-8 m-auto bg-gradient-to-br from-slate-950 via-slate-900 to-blue-950">
    <div class="form-container bg-gray-800 p-8 rounded-lg shadow-md w-full  max-w-md m-auto justify-center items-center">
        <form (ngSubmit)="validarLogin()">
            <h2 class="text-white text-2xl font-bold mb-6 text-center">Iniciar Sesión</h2>
            <div class="mb-4">
                <label for="username" class="block text-white mb-2">Usuario:</label>
                <input type="text" id="username" name="username" class="w-full p-2 rounded-lg bg-gray-800 text-white focus:outline-none border-b border-gray-500" required [(ngModel)]="usuario">
            </div>
            <div class="mb-6">
                <label for="password" class="block text-white mb-2">Contraseña:</label>
                <input type="password" id="password" name="password" class="w-full p-2 rounded-lg bg-gray-800 text-white focus:outline-none border-b border-gray-500" required [(ngModel)]="clave">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition-colors duration-300 cursor-pointer hover:scale-105">Ingresar</button>
        </form>
    </div>
</div>
